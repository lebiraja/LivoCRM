
services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"   # host 5435 — free (5432/5433 taken by other projects)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    networks:
      - livocrm

  # ── Redis (session cache + future pub/sub) ───────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - livocrm
    restart: unless-stopped

  # ── FastAPI backend ──────────────────────────────────────────────────────
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - livocrm
    # NOT exposed to host — nginx is the only entry point

  # ── React SPA (served by nginx inside the container) ────────────────────
  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - livocrm
    # NOT exposed to host — nginx reverse proxy serves it

  # ── Nginx reverse proxy (single public entry point) ─────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3500:80"      # http://localhost:3500 — free on this machine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - livocrm
    restart: unless-stopped

  # ── pgAdmin 4 (database GUI) ──────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@livocrm.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"        # http://localhost:5050
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - livocrm
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  pgadmin_data:

networks:
  livocrm:
    driver: bridge
