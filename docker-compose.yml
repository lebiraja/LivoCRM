
services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16.15-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOT exposed to host — use the dev-profile pgAdmin (see docs/pgadmin_setup.md)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    networks:
      - livocrm

  # ── Redis (session cache + future pub/sub) ───────────────────────────────
  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks:
      - livocrm
    restart: unless-stopped

  # ── FastAPI backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: runtime
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - livocrm
    # NOT exposed to host — nginx is the only entry point

  # ── React SPA (served by nginx inside the container) ────────────────────
  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - livocrm
    # NOT exposed to host — nginx reverse proxy serves it

  # ── Nginx reverse proxy (single public entry point) ─────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3500:80"      # http://localhost:3500 — free on this machine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - livocrm
    restart: unless-stopped

  # ── pgAdmin 4 (database GUI, dev only) ───────────────────────────────────
  # docker compose --profile dev up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:5050:80"   # http://127.0.0.1:5050 — this machine only
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - livocrm
    restart: unless-stopped

  # ── Test profile: throwaway Postgres (tmpfs) + backend test image ────────
  # docker compose --profile test run --rm --build backend-test pytest
  db-test:
    image: postgres:16.15-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: livocrm_test
      # Throwaway tmpfs DB on an internal network with no published port
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d livocrm_test"]
      interval: 2s
      retries: 15
    networks:
      - livocrm-test

  backend-test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres@db-test:5432/livocrm_test
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - livocrm-test

volumes:
  pgdata:
  redisdata:
  pgadmin_data:

networks:
  livocrm:
    driver: bridge
  livocrm-test:
    internal: true
