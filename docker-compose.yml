
services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livocrm_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: livocrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"   # host 5435 — free (5432/5433 taken by other projects)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livocrm_user -d livocrm"]
      interval: 5s
      retries: 5
    networks:
      - livocrm

  # ── FastAPI backend ──────────────────────────────────────────────────────
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - livocrm
    # NOT exposed to host — nginx is the only entry point

  # ── React SPA (served by nginx inside the container) ────────────────────
  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - livocrm
    # NOT exposed to host — nginx reverse proxy serves it

  # ── Nginx reverse proxy (single public entry point) ─────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3500:80"      # http://localhost:3500 — free on this machine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - livocrm
    restart: unless-stopped

volumes:
  pgdata:

networks:
  livocrm:
    driver: bridge
