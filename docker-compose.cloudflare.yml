# Production ingress using a remotely-managed Cloudflare Tunnel.
# Run together with docker-compose.yml; the tunnel route in Cloudflare must point to
# http://nginx:80. No app/database ports are published to the host.

services:
  nginx:
    ports: !reset []
    networks:
      livocrm: {}
      tunnel-edge:
        ipv4_address: 172.30.240.3

  backend:
    environment:
      AUTH_COOKIE_SECURE: "true"
      ENABLE_DOCS: "false"
      ALLOW_REGISTRATION: "false"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://nginx:80", "run"]
    # Only the tunnel token, not the whole .env, same pattern as db
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      tunnel-edge:
        ipv4_address: 172.30.240.2

networks:
  tunnel-edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.240.0/24
